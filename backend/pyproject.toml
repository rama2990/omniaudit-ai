[project]
name = "omniaudit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "python-multipart",
  "pymupdf",
  "rapidocr-onnxruntime",
  "google-genai",
  "reportlab",
  "jellyfish",
  "python-dotenv",
  "google-cloud-firestore>=2.34.1",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
