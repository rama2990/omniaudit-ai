[project]
name = "omniaudit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlmodel", "python-multipart",
  "pymupdf", "rapidocr-onnxruntime", "google-genai", "reportlab",
  "jellyfish", "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
